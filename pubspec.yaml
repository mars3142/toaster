name: toaster
description: Toaster records every message.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+10000

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9
  go_router: ^14.2.3
  intl: ^0.19.0
  riverpod_context: ^0.3.0
  riverpod_annotation: ^2.3.3
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.12
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.2.1
  riverpod_lint: ^2.1.1
  go_router_builder: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true
